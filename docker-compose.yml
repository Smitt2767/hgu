services:
  postgres:
    image: postgres:18-alpine
    container_name: hgu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hgu
      POSTGRES_PASSWORD: hgu
      POSTGRES_DB: hgu
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18 images set PGDATA to /var/lib/postgresql/18/docker,
      # so the whole /var/lib/postgresql tree is the mount point.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hgu -d hgu']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
